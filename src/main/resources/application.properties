micronaut.application.name=llms-txt-joaquin-duran
micronaut.server.host=0.0.0.0
micronaut.server.port=${PORT:8080}
micronaut.router.static-resources.frontend.mapping=/**
micronaut.router.static-resources.frontend.paths=classpath:public
micronaut.server.max-request-size=${MAX_API_BODY_BYTES:2097152}
dynamodb.environment=${APP_ENV:local}
dynamodb.table=${DYNAMODB_TABLE:llms-txt-local}
dynamodb.region=${AWS_REGION:us-east-1}
dynamodb.endpoint=${DYNAMODB_ENDPOINT:}
dynamodb.work-index-shards=${WORK_INDEX_SHARDS:1}
dynamodb.due-index-shards=${DUE_INDEX_SHARDS:1}
logger.levels.root=${LOG_LEVEL:INFO}
admission.pipeline-version=${PIPELINE_VERSION:deterministic-v4}
admission.max-batch-urls=${MAX_BATCH_URLS:1000}
admission.max-open-bulk-batches=${MAX_OPEN_BULK_BATCHES:5}
admission.max-url-bytes=${MAX_URL_BYTES:2048}
admission.batch-admission-timeout-seconds=${BATCH_ADMISSION_TIMEOUT_SECONDS:30}
admission.max-outstanding-runs=${MAX_OUTSTANDING_RUNS:40}
admission.max-monitored-identities=${MAX_MONITORED_IDENTITIES:50}
admission.crawl-freshness-ttl-seconds=${CRAWL_FRESHNESS_TTL_SECONDS:900}
admission.max-crawl-duration-seconds=${MAX_CRAWL_DURATION_SECONDS:180}
admission.run-recovery-grace-seconds=${RUN_RECOVERY_GRACE_SECONDS:30}
admission.force-identity-cooldown-seconds=${FORCE_IDENTITY_COOLDOWN_SECONDS:60}
admission.batch-retention-days=${BATCH_RETENTION_DAYS:7}
admission.max-depth=${MAX_DEPTH:3}
admission.max-pages=${MAX_PAGES:10}
admission.max-candidates=${MAX_CANDIDATES:300}
admission.max-url-evaluations=${MAX_URL_EVALUATIONS:2000}
admission.max-links-inspected=${MAX_LINKS_INSPECTED:5000}
admission.max-requests=${MAX_REQUESTS:60}
admission.max-selected-resources=${MAX_SELECTED_RESOURCES:10}
api-limits.reads-per-minute-per-client=${API_READS_PER_MINUTE_PER_CLIENT:120}
api-client.trusted-proxy-cidrs=${TRUSTED_PROXY_CIDRS:}
api-limits.submissions-per-minute-per-client=${API_SUBMISSIONS_PER_MINUTE_PER_CLIENT:6}
api-limits.submissions-per-minute-global=${API_SUBMISSIONS_PER_MINUTE_GLOBAL:30}
api-limits.urls-per-minute-per-client=${API_URLS_PER_MINUTE_PER_CLIENT:1000}
api-limits.urls-per-minute-global=${API_URLS_PER_MINUTE_GLOBAL:2000}
api-limits.force-requests-per-five-minutes-per-client=${FORCE_REQUESTS_PER_5_MINUTES_PER_CLIENT:3}
crawl.enabled=${CRAWL_ENABLED:true}
crawl.max-concurrent-crawls=${MAX_CONCURRENT_CRAWLS:12}
crawl.max-active-crawls-per-origin=${MAX_ACTIVE_CRAWLS_PER_ORIGIN:1}
crawl.max-requests-per-origin=${MAX_REQUESTS_PER_ORIGIN:1}
crawl.min-request-interval-millis=${MIN_REQUEST_INTERVAL_MILLIS:1000}
crawl.request-timeout-seconds=${REQUEST_TIMEOUT_SECONDS:10}
crawl.max-response-bytes=${MAX_RESPONSE_BYTES:2097152}
crawl.max-robots-bytes=${MAX_ROBOTS_BYTES:524288}
crawl.max-sitemap-bytes=${MAX_SITEMAP_BYTES:1048576}
crawl.max-sitemap-documents=${MAX_SITEMAP_DOCUMENTS:3}
crawl.max-sitemap-entries=${MAX_SITEMAP_ENTRIES:1000}
crawl.max-redirects=${MAX_REDIRECTS:5}
crawl.robots-cache-ttl-seconds=${ROBOTS_CACHE_TTL_SECONDS:900}
crawl.origin-state-idle-ttl-seconds=${ORIGIN_STATE_IDLE_TTL_SECONDS:900}
crawl.origin-cache-max-entries=${ORIGIN_CACHE_MAX_ENTRIES:1000}
crawl.max-llms-bytes=${MAX_LLMS_BYTES:65536}
crawl.max-resource-metadata-bytes=${MAX_RESOURCE_METADATA_BYTES:8192}
crawl.title-max-chars=${TITLE_MAX_CHARS:120}
crawl.description-max-chars=${DESCRIPTION_MAX_CHARS:240}
crawl.origin-default-backoff-seconds=${ORIGIN_DEFAULT_BACKOFF_SECONDS:60}
crawl.dispatch-poll-seconds=${DISPATCH_POLL_SECONDS:2}
crawl.dispatch-candidate-limit=${DISPATCH_CANDIDATE_LIMIT:40}
crawl.run-retention-days=${RUN_RETENTION_DAYS:7}
crawl.monitor-interval-seconds=${MONITOR_INTERVAL_SECONDS:86400}
crawl.monitor-window-seconds=${MONITOR_WINDOW_SECONDS:604800}
crawl.scheduler-tick-seconds=${SCHEDULER_TICK_SECONDS:5}
crawl.scheduler-candidate-limit=${SCHEDULER_CANDIDATE_LIMIT:40}
crawl.monitor-pending-recheck-seconds=${MONITOR_PENDING_RECHECK_SECONDS:60}
crawl.monitor-failure-backoff-seconds=${MONITOR_FAILURE_BACKOFF_SECONDS:900}
