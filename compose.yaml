name: llms-txt-joaquin-duran

x-local-environment: &local-environment
  APP_ENV: local
  DYNAMODB_ENDPOINT: http://dynamodb:8000
  DYNAMODB_TABLE: ${DYNAMODB_TABLE:-llms-txt-local}
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: localSecret
  WORK_INDEX_SHARDS: ${WORK_INDEX_SHARDS:-1}
  DUE_INDEX_SHARDS: ${DUE_INDEX_SHARDS:-1}
  AWS_EC2_METADATA_DISABLED: "true"

services:
  dynamodb:
    image: amazon/dynamodb-local:3.3.1
    # Docker creates a fresh named-volume directory as root; Local must be able to write it.
    user: "0:0"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data", "-disableTelemetry"]
    working_dir: /home/dynamodblocal
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data

  dynamodb-init:
    image: llms-txt-joaquin-duran:local
    build:
      context: .
      target: runtime
    command: ["--init-local"]
    environment: *local-environment
    depends_on:
      dynamodb:
        condition: service_started
    restart: "no"

  app:
    image: llms-txt-joaquin-duran:local
    build:
      context: .
      target: runtime
    environment:
      <<: *local-environment
      PORT: ${PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_IO_THREADS: ${API_IO_THREADS:-8}
      API_IO_QUEUE_CAPACITY: ${API_IO_QUEUE_CAPACITY:-32}
      PIPELINE_VERSION: ${PIPELINE_VERSION:-deterministic-v4}
      MAX_BATCH_URLS: ${MAX_BATCH_URLS:-1000}
      MAX_API_BODY_BYTES: ${MAX_API_BODY_BYTES:-2097152}
      MAX_URL_BYTES: ${MAX_URL_BYTES:-2048}
      BATCH_ADMISSION_TIMEOUT_SECONDS: ${BATCH_ADMISSION_TIMEOUT_SECONDS:-30}
      MAX_OUTSTANDING_RUNS: ${MAX_OUTSTANDING_RUNS:-40}
      MAX_MONITORED_IDENTITIES: ${MAX_MONITORED_IDENTITIES:-50}
      CRAWL_FRESHNESS_TTL_SECONDS: ${CRAWL_FRESHNESS_TTL_SECONDS:-900}
      MAX_CRAWL_DURATION_SECONDS: ${MAX_CRAWL_DURATION_SECONDS:-180}
      RUN_RECOVERY_GRACE_SECONDS: ${RUN_RECOVERY_GRACE_SECONDS:-30}
      BATCH_RETENTION_DAYS: ${BATCH_RETENTION_DAYS:-7}
      MAX_DEPTH: ${MAX_DEPTH:-3}
      MAX_PAGES: ${MAX_PAGES:-10}
      MAX_CANDIDATES: ${MAX_CANDIDATES:-300}
      MAX_URL_EVALUATIONS: ${MAX_URL_EVALUATIONS:-2000}
      MAX_LINKS_INSPECTED: ${MAX_LINKS_INSPECTED:-5000}
      MAX_REQUESTS: ${MAX_REQUESTS:-60}
      MAX_SELECTED_RESOURCES: ${MAX_SELECTED_RESOURCES:-10}
      CRAWL_ENABLED: ${CRAWL_ENABLED:-true}
      MAX_CONCURRENT_CRAWLS: ${MAX_CONCURRENT_CRAWLS:-12}
      MAX_ACTIVE_CRAWLS_PER_ORIGIN: ${MAX_ACTIVE_CRAWLS_PER_ORIGIN:-1}
      MAX_REQUESTS_PER_ORIGIN: ${MAX_REQUESTS_PER_ORIGIN:-1}
      MIN_REQUEST_INTERVAL_MILLIS: ${MIN_REQUEST_INTERVAL_MILLIS:-1000}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-10}
      MAX_RESPONSE_BYTES: ${MAX_RESPONSE_BYTES:-2097152}
      MAX_ROBOTS_BYTES: ${MAX_ROBOTS_BYTES:-524288}
      MAX_SITEMAP_BYTES: ${MAX_SITEMAP_BYTES:-1048576}
      MAX_SITEMAP_DOCUMENTS: ${MAX_SITEMAP_DOCUMENTS:-3}
      MAX_SITEMAP_ENTRIES: ${MAX_SITEMAP_ENTRIES:-1000}
      MAX_REDIRECTS: ${MAX_REDIRECTS:-5}
      ROBOTS_CACHE_TTL_SECONDS: ${ROBOTS_CACHE_TTL_SECONDS:-900}
      ORIGIN_STATE_IDLE_TTL_SECONDS: ${ORIGIN_STATE_IDLE_TTL_SECONDS:-900}
      ORIGIN_CACHE_MAX_ENTRIES: ${ORIGIN_CACHE_MAX_ENTRIES:-1000}
      MAX_LLMS_BYTES: ${MAX_LLMS_BYTES:-65536}
      MAX_RESOURCE_METADATA_BYTES: ${MAX_RESOURCE_METADATA_BYTES:-8192}
      TITLE_MAX_CHARS: ${TITLE_MAX_CHARS:-120}
      DESCRIPTION_MAX_CHARS: ${DESCRIPTION_MAX_CHARS:-240}
      ORIGIN_DEFAULT_BACKOFF_SECONDS: ${ORIGIN_DEFAULT_BACKOFF_SECONDS:-60}
      DISPATCH_POLL_SECONDS: ${DISPATCH_POLL_SECONDS:-2}
      DISPATCH_CANDIDATE_LIMIT: ${DISPATCH_CANDIDATE_LIMIT:-40}
      RUN_RETENTION_DAYS: ${RUN_RETENTION_DAYS:-7}
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-86400}
      MONITOR_WINDOW_SECONDS: ${MONITOR_WINDOW_SECONDS:-604800}
      SCHEDULER_TICK_SECONDS: ${SCHEDULER_TICK_SECONDS:-5}
      SCHEDULER_CANDIDATE_LIMIT: ${SCHEDULER_CANDIDATE_LIMIT:-40}
      MONITOR_PENDING_RECHECK_SECONDS: ${MONITOR_PENDING_RECHECK_SECONDS:-60}
      MONITOR_FAILURE_BACKOFF_SECONDS: ${MONITOR_FAILURE_BACKOFF_SECONDS:-900}
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/opt/app/bin/llms-txt-joaquin-duran", "--probe"]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 30s

  verifier:
    profiles: ["verification"]
    build:
      context: .
      target: backend-build
    environment: *local-environment
    volumes:
      - ./build/test-results:/workspace/build/test-results
    entrypoint: ["./gradlew", "--no-daemon"]
    command: ["test", "integrationTest", "--rerun-tasks"]
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully

volumes:
  dynamodb-data:
